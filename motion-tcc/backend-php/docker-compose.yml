services:
  mysql:
    image: mysql:8.4
    container_name: motion_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # acessível só neste computador (ponte Python)
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - motion_mysql_data:/var/lib/mysql
      # Schema e dados iniciais: database/init.sql (executa só na primeira subida).
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: ./backend
    container_name: motion_php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DEBUG: "1"
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

volumes:
  motion_mysql_data:
